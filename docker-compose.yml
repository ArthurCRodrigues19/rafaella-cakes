services:
  postgres:
    image: postgres:16-alpine
    container_name: rafaella-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rafaella
      POSTGRES_PASSWORD: rafaella
      POSTGRES_DB: rafaella_cakes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Caixa de e-mails local para desenvolvimento: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: rafaella-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
